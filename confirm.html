<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Email Confirmation | Shoot-Shot.edu</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <!-- Header -->
  <header>
    <h1>Confirm Your Email</h1>
    <p class="quote">A verification code was sent to your email. Enter it below to continue.</p>
  </header>

  <!-- Confirmation Section -->
  <main class="confirm-code">
    <section>
      <h2>Email Verification</h2>
      <p>Please check your inbox and enter the code sent to your email address.</p>

      <form action="set-password.html" method="post">
        <input type="text" placeholder="Enter 6-digit code" required />
        <button type="submit" class="auth-btn email">Verify & Continue</button>
      </form>

      <p class="resend-note">Didn't get the code? <a href="#">Resend</a></p>
    </section>
  </main>

  <!-- Footer -->
  <footer>
    <p>© 2025 Shoot-Shot.edu — Strategically Engineered by Aiza</p>
  </footer>

</body>
</html>
