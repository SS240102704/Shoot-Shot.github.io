<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Create Account | Shoot-Shot.edu</title>
  <link rel="stylesheet" href="style.css" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
</head>
<body>

  <!-- Header -->
  <header>
    <h1>Create Your Account</h1>
    <p class="quote">Choose your platform to begin your journey into the academy.</p>
  </header>

  <!-- Registration Flow -->
  <main class="register-flow">
    <section>
      <h2>Select a Sign Up Method</h2>
      <p>Your identity matters—start with your preferred platform below.</p>

      <div class="auth-choices">
        <button class="auth-btn google">
          <i class="fab fa-google"></i> Continue with Google
        </button>

        <button class="auth-btn facebook">
          <i class="fab fa-facebook-f"></i> Continue with Facebook
        </button>

        <button class="auth-btn microsoft">
          <i class="fab fa-microsoft"></i> Continue with Microsoft
        </button>

        <form action="confirm.html">
          <input type="email" placeholder="Use Email instead" required />
          <button type="submit" class="auth-btn email">
            <i class="fas fa-envelope"></i> Continue with Email
          </button>
        </form>
      </div>
    </section>
  </main>

  <!-- Footer -->
  <footer>
    <p>© 2025 Shoot-Shot.edu — Strategically Engineered by Aiza</p>
  </footer>

</body>
</html>
