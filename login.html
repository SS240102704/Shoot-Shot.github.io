<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Sign In | Shoot-Shot.edu</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <!-- Header -->
  <header>
    <h1>Sign In</h1>
    <p class="quote">Access your learning vault and tactical modules.</p>
  </header>

  <!-- Login Form Section -->
  <main class="login-form">
    <section>
      <h2>Welcome Back</h2>
      <p>Enter your registered email and password to continue.</p>
      <form action="dashboard.html" method="post">
        <input type="email" placeholder="Gmail address" required />
        <input type="password" placeholder="Password" required />
        <button type="submit" class="auth-btn email">Access Account</button>
      </form>
    </section>
  </main>

  <!-- Footer -->
  <footer>
    <p>© 2025 Shoot-Shot.edu — Strategically Engineered by Aiza</p>
  </footer>

</body>
</html>
