<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Set Your Password | Shoot-Shot.edu</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <!-- Header -->
  <header>
    <h1>Create Your Academy Access</h1>
    <p class="quote">You're one step away from entering the vault.</p>
  </header>

  <!-- Password Setup Section -->
  <main class="set-password">
    <section>
      <h2>Set Your Password</h2>
      <p>Secure your account with a strong password to complete your registration.</p>

      <form action="dashboard.html" method="post">
        <input type="password" placeholder="Create Password" required />
        <input type="password" placeholder="Confirm Password" required />
        <button type="submit" class="auth-btn email">Complete Setup</button>
      </form>
    </section>
  </main>

  <!-- Footer -->
  <footer>
    <p>© 2025 Shoot-Shot.edu — Strategically Engineered by Aiza</p>
  </footer>

</body>
</html>
